# Render.com deploy for the license + key-issuance server (v2:
# NowPayments invoice -> Ed25519 key -> Telegram delivery to the paying chat).
# NOTE: the live service is dashboard-driven (Root Directory: Interview Assistant/server);
# this file documents the required env vars.
services:
  - type: web
    name: interview-license-server
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PRICE_USD
        value: 14.99
      - key: PERIOD_DAYS
        value: 30
      - key: DEVICE_CAP
        value: 2
      - key: MOCK_NOWPAYMENTS
        value: 0
      - key: PUBLIC_BASE_URL
        value: https://interview-assistant-okvy.onrender.com
      - key: SIGNING_PRIVATE_KEY
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: IPN_CALLBACK_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
